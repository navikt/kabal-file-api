# Detekt is deliberately scoped to a single rule: NamedArguments.
#
# Formatting is owned by ktlint (see .editorconfig), so detekt's formatting
# ruleset is not on the classpath at all. Every other ruleset is switched off
# here rather than left at its default, so that enabling a new rule stays a
# conscious decision rather than a side effect of a detekt upgrade.

comments:
  active: false

coroutines:
  active: false

empty-blocks:
  active: false

exceptions:
  active: false

naming:
  active: false

performance:
  active: false

potential-bugs:
  active: false

style:
  active: false

complexity:
  active: true
  CognitiveComplexMethod:
    active: false
  ComplexCondition:
    active: false
  ComplexInterface:
    active: false
  CyclomaticComplexMethod:
    active: false
  LabeledExpression:
    active: false
  LargeClass:
    active: false
  LongMethod:
    active: false
  LongParameterList:
    active: false
  MethodOverloading:
    active: false
  NestedBlockDepth:
    active: false
  NestedScopeFunctions:
    active: false
  ReplaceSafeCallChainWithRun:
    active: false
  StringLiteralDuplication:
    active: false
  TooManyFunctions:
    active: false
  NamedArguments:
    active: true
    # Calls with more than this many positional arguments must name them.
    allowedArguments: 3
    # A call like foo(id) where the parameter is also named id gains nothing
    # from being written as foo(id = id).
    ignoreArgumentsMatchingNames: true
