spring:
  application:
    name: kabal-file-api
  main:
    banner-mode: OFF
  servlet:
    multipart:
      max-request-size: 500MB
      max-file-size: 500MB

server:
  port: 7080
  error:
    whitelabel:
      enabled: false

#Token validation
no.nav.security.jwt:
  issuer.azuread:
    discoveryurl: ${AZURE_APP_WELL_KNOWN_URL}
    accepted_audience: ${AZURE_APP_CLIENT_ID}

management:
  endpoint:
    health:
      show-details: always
  endpoints.web:
    exposure:
      include: info, health, metrics, prometheus
    base-path: "/internal"
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: false

CLAM_AV_URL: http://clamav.nais-system/api/v2/scan

#Image to PDF conversion is by far the most memory hungry work the service does: peak heap scales
#linearly with how many run at once, and two 500 MB files in parallel was enough to OOM the pod.
#Serialising them keeps the peak at one conversion's worth regardless of how many requests arrive.
conversion:
  max-concurrent: 1
  permit-timeout-seconds: 120
