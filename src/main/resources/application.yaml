spring:
  application:
    name: kabal-file-api
  main:
    banner-mode: OFF
  servlet:
    multipart:
      max-request-size: 500MB
      max-file-size: 500MB

server:
  port: 7080
  error:
    whitelabel:
      enabled: false

#Token validation
no.nav.security.jwt:
  issuer.azuread:
    discoveryurl: ${AZURE_APP_WELL_KNOWN_URL}
    accepted_audience: ${AZURE_APP_CLIENT_ID}

management:
  endpoint:
    health:
      show-details: always
  endpoints.web:
    exposure:
      include: info, health, metrics, prometheus
    base-path: "/internal"
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: false

CLAM_AV_URL: http://clamav.nais-system/api/v2/scan

#Image to PDF conversion is the most memory hungry work the service does. Bounding how many run at
#once keeps the worst case peak well inside the pod's memory limit.
conversion:
  max-concurrent: 2
  permit-timeout-seconds: 120
