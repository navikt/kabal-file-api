name: Build, deploy dev, deploy prod

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/dependabot.yaml'
  schedule:
    # Weekdays: rebuild only if the Chainguard base image has a new digest
    - cron: '0 5 * * 1-5'
      timezone: 'Europe/Oslo'
  workflow_dispatch:

jobs:
  check-base-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      changed: ${{ steps.cache.outputs.cache-hit != 'true' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: nais/login@v0
        with:
          team: klage
      - name: Resolve base image digest
        id: digest
        run: |
          image=$(awk '/^FROM/ {print $2; exit}' Dockerfile)
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -r .digest)
          echo "Base image $image has digest $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Look up last built digest
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: base-image-digest
          key: base-image-${{ steps.digest.outputs.digest }}
          lookup-only: true

  build:
    needs: check-base-image
    # Always build on push and manual runs. On schedule, only when the base image changed.
    # If the check fails, build anyway so security updates are not silently skipped.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.check-base-image.result != 'success' || needs.check-base-image.outputs.changed == 'true') }}
    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write
    uses: navikt/klage-workflows/.github/workflows/build-deploy-main.yaml@main
    with:
      e2e-tests: 'kabal'
      java-version: '25'
    secrets: inherit

  save-base-image-digest:
    needs: [check-base-image, build]
    if: ${{ needs.build.result == 'success' && needs.check-base-image.outputs.digest != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Write digest
        env:
          DIGEST: ${{ needs.check-base-image.outputs.digest }}
        run: echo "$DIGEST" > base-image-digest
      - uses: actions/cache/save@v6.1.0
        with:
          path: base-image-digest
          key: base-image-${{ needs.check-base-image.outputs.digest }}
