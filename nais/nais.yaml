apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: kabal-file-api
  namespace: klage
  labels:
    team: klage
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "500M"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  image: {{ image }}
  azure:
    application:
      enabled: true
      allowAllUsers: true
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
  port: 7080
  accessPolicy:
    inbound:
      rules:
        - application: kabal-api
        - application: kabal-document
        - application: kabin-api
    outbound:
      rules:
        - application: clamav
          namespace: nais-system
        - application: klage-unleash-proxy
  liveness:
    path: /internal/health
    initialDelay: 20
    timeout: 1
    periodSeconds: 5
    failureThreshold: 10
  readiness:
    path: /internal/health
    initialDelay: 20
    timeout: 1
  resources:
    limits:
      memory: 1024Mi
      #Each in-flight request buffers the original file on disk (up to the 512 MB upload limit) before
      #it is converted, so this has to cover several large uploads at once, not just one.
      ephemeral-storage: 4Gi
    requests:
      cpu: 50m
      memory: 512Mi
      ephemeral-storage: 1Gi
  replicas:
    min: 2
    max: 4
    cpuThresholdPercentage: 80
  prometheus:
    enabled: true
    path: /internal/prometheus
  webproxy: true
  envFrom:
    - secret: gcs-credentials
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: {{springProfile}}
    {{#each envs}}
    - name: {{name}}
      value: {{value}}
    {{/each}}
